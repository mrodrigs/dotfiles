# Autostart. Base processes first, then your own additions below.

exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- noctalia
exec-once = uwsm-app -- fcitx5 --disable notificationitem

# FHS path (Arch/Omarchy) for the polkit auth agent — on NixOS this line is a
# harmless no-op, the agent runs as a systemd user service instead (see
# nixos/hosts/pc/configuration.nix).
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# Extra autostart processes
# exec-once = uwsm-app -- my-service
