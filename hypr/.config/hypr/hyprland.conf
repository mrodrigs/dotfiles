# Learn how to configure Hyprland: https://wiki.hyprland.org/Configuring/
# Each file below is a single flat layer (no distro-style default/override split —
# this is a personal config, not a distro).

source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/windows.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Forza Horizon 6 - force fullscreen and disable opacity
windowrule = fullscreen on, match:class steam_app_2483190
windowrule = tag -default-opacity, match:class steam_app_2483190
windowrule = opacity 1 1, match:class steam_app_2483190
windowrule = idle_inhibit always, match:class steam_app_2483190

# Remove opacity effects for specific apps (override defaults from windows.conf/browser.conf)
windowrule = opacity 1.0 override 1.0 override, match:tag chromium-based-browser
windowrule = opacity 1.0 override 1.0 override, match:class pxgme-linux
