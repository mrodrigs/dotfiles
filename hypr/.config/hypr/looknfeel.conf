# Look'n'feel. Colors/animations below are the "Take Easy" theme, frozen as
# static values — everything else is straight Hyprland defaults plus your
# own tweaks at the bottom.

$beamDark    = rgba(161616ff)   # dark base (Take Easy background)
$neonWhite   = rgba(f2f4f8ff)   # base05 foreground
$neonMagenta = rgba(ee5396ff)
$activeBorderColor = rgba(33ccffee) rgba(00ff99ee) 45deg
$inactiveBorderColor = rgba(595959aa)

general {
    gaps_in = 4
    gaps_out = 6
    border_size = 3
    col.active_border = $neonWhite $beamDark $beamDark $beamDark $beamDark $beamDark $beamDark $beamDark $beamDark $neonMagenta 25deg
    col.inactive_border = rgba(262626FF)
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    layout = dwindle
}

# Synthetica-style orbiting neon beam: mostly-dark border with short white +
# magenta beams. The border gradient is linear (0% -> 100% across the
# window). Putting the two bright colors at the very ends (white at 0%,
# magenta at 100%) keeps them on opposite edges, so as the borderangle
# animation sweeps the gradient they orbit antipodally — when one is on top
# the other is on the bottom.
decoration {
    rounding = 4

    shadow {
        enabled = true
        range = 2
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 2
        passes = 2
        special = true
        brightness = 0.5
        contrast = 1.5
        vibrancy = 0.4
        vibrancy_darkness = 0.4
        noise = 0.02
        ignore_opacity = true
        new_optimizations = on
    }

    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1.0
}

# Group borders keep the original (non-themed) blue/green accent — a
# deliberate distinct signal from the neon active-window border above.
group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(ffffff)
        text_color_inactive = rgba(ffffff90)
        col.active = rgba(00000040)
        col.inactive = rgba(00000020)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = global, 1, 10, default
    animation = border, 1, 1, liner
    animation = borderangle, 1, 150, liner, loop
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 10, default
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 5, wind
    animation = specialWorkspace, 1, 5, wind, slidevert
}

gestures {
    gesture = 3, left, dispatcher, workspace, -1
    gesture = 3, right, dispatcher, workspace, +1
}

dwindle {
    preserve_split = true
    force_split = 2
}

scrolling {
    column_width = 0.49
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    disable_scale_notification = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

binds {
    hide_special_on_workspace_change = true
}

